name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest -q

  # Официальный валидатор W3C: книга должна проходить его без ошибок и предупреждений.
  epubcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
      - name: Build example and template books
        run: |
          python -m epubnik build examples/zametki -o out/zametki.epub
          python -m epubnik new out/template
          python -m epubnik build out/template -o out/template.epub
      - name: Validate
        run: |
          for f in out/*.epub; do java -jar epubcheck-5.1.0/epubcheck.jar --failonwarnings "$f"; done
